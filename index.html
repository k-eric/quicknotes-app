<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture and organize your thoughts seamlessly</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Content:</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>
                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>
                <button type="submit">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <section class="notes-section">
            <h2>Your notes</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>
            <div class="actions-container">
                <p id="note-count">You have no notes yet.</p>
                <button id="clear-all-btn" type="button">Clear All</button>
            </div>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built with Web Foundations.</p>
    </footer>
</body>
</html>
